<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EMPTY CONSOLE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tiny5&display=block"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="booting">
    <div id="boot" aria-live="polite">
      <div id="boot-prompt" class="boot-prompt"><span class="cursor">█</span></div>
    </div>

    <div id="site">
      <header class="chrome">
        <nav class="tabstrip" aria-label="sections">
          <a class="tab is-on" href="#home">Home</a>
          <a class="tab" href="#projects">projects</a>
          <a class="tab" href="#team">usr</a>
        </nav>
        <div class="chip" tabindex="0">v0.0.1</div>
      </header>

      <section id="home" class="hero">
        <div class="hero-copy">
          <p class="kicker" data-k="./empty-console"></p>
          <h1 data-k="EMPTY CONSOLE"></h1>
          <p class="prompt">
            <span data-k="$ ls /"></span><span class="cursor">█</span>
          </p>
          <p class="hero-ls">
            <a href="#projects">projects/</a>
            <a href="#team">usr/</a>
          </p>
        </div>
        <p class="scroll-hint">v scroll to mount</p>
      </section>

      <main class="page">
        <section id="projects" class="block">
          <h2 class="block-label" data-reveal># ./projects</h2>
          <article class="term" data-print data-reveal tabindex="0">
            <div class="term-tabs" role="tablist" aria-label="projects">
              <button
                class="tab is-on"
                role="tab"
                aria-selected="true"
                data-tab="p1"
                id="tab-p1"
              >
                Student Atlas
              </button>
              <button
                class="tab"
                role="tab"
                aria-selected="false"
                data-tab="p2"
                id="tab-p2"
              >
                Propose Project
              </button>
            </div>
            <div class="term-frame panel">
              <div class="titlebar">cat README</div>
              <div class="term-body">
                <div
                  class="pane is-on"
                  id="p1"
                  role="tabpanel"
                  aria-labelledby="tab-p1"
                >
                  <div class="ln" data-k="$ cat ./projects/student_atlas/README"></div>
                  <div class="ln mag" data-k="Student Atlas"></div>
                  <div class="ln dim" data-k="/empty/projects/student_atlas"></div>
                  <div class="ln" data-k=""></div>
                  <div class="ln" data-k="path:    /empty/projects/student_atlas"></div>
                  <div class="ln" data-k="status:  in progress"></div>
                  <div class="ln" data-k="type:    website"></div>
                  <div class="ln" data-k="readme:  A course catalog selector for all students and schools."></div>
                  <div
                    class="ln"
                    data-k="github:  https://github.com/EmptyConsole/Student-Atlas"
                    data-href="https://github.com/EmptyConsole/Student-Atlas"
                  ></div>
                </div>
                <div
                  class="pane"
                  id="p2"
                  role="tabpanel"
                  aria-labelledby="tab-p2"
                  hidden
                >
                  <div class="ln" data-k="$ cat ./projects/propose/README"></div>
                  <div class="ln mag" data-k="Propose Project"></div>
                  <div class="ln dim" data-k="/empty/projects/propose"></div>
                  <div class="ln" data-k=""></div>
                  <div class="ln" data-k="path:    /empty/projects/propose"></div>
                  <div class="ln" data-k="status:  untracked"></div>
                  <div class="ln" data-k="type:    [open]"></div>
                  <div class="ln" data-k="readme:  a slot waiting on the next build"></div>
                  <div class="ln" data-k=""></div>
                  <div class="ln dim" data-k="# TODO: propose a project"></div>
                </div>
              </div>
            </div>
          </article>
        </section>

        <section id="team" class="block">
          <h2 class="block-label" data-reveal># ./usr</h2>
          <div class="team-row">
            <article
              class="panel term member"
              data-print
              data-reveal
              tabindex="0"
              style="--member-accent: #2dd4bf"
            >
              <div class="titlebar">usr@emey</div>
              <div class="term-body">
                <div class="avatar-frame">
                  <img
                    class="avatar"
                    src="assets/emey.webp"
                    alt="Emey"
                    width="256"
                    height="256"
                  />
                </div>
                <div class="ln" data-k="$ whoami"></div>
                <div class="ln mag" data-k="Emey / Tooffu"></div>
                <div class="ln" data-k="discord: qorachniuphorbia"></div>
                <div class="ln" data-k="role:    music, art, database"></div>
                <div class="ln" data-k="status:  active"></div>
                <div class="ln dim" data-k="tty:     pts/1"></div>
              </div>
            </article>
            <article
              class="panel term member"
              data-print
              data-reveal
              tabindex="0"
              style="--member-accent: #f5c518"
            >
              <div class="titlebar">usr@hucklberi</div>
              <div class="term-body">
                <div class="avatar-frame">
                  <img
                    class="avatar"
                    src="assets/hucklberi.png"
                    alt="hucklberi"
                    width="256"
                    height="256"
                  />
                </div>
                <div class="ln" data-k="$ whoami"></div>
                <div class="ln mag" data-k="HF_ang / hucklberi"></div>
                <div class="ln" data-k="discord: basicallyahucklberi"></div>
                <div class="ln" data-k="role:    code, design"></div>
                <div class="ln" data-k="status:  active"></div>
                <div class="ln dim" data-k="tty:     pts/2"></div>
              </div>
            </article>
            <article
              class="panel term member"
              data-print
              data-reveal
              tabindex="0"
              style="--member-accent: #e23b3b"
            >
              <div class="titlebar">usr@shyguy</div>
              <div class="term-body">
                <div class="avatar-frame">
                  <img
                    class="avatar"
                    src="assets/shyguy.webp"
                    alt="ShyGuy"
                    width="256"
                    height="256"
                  />
                </div>
                <div class="ln" data-k="$ whoami"></div>
                <div class="ln mag" data-k="ShyGuy"></div>
                <div class="ln" data-k="discord: shyguygamedev"></div>
                <div class="ln" data-k="role:    code, marketing"></div>
                <div class="ln" data-k="status:  active"></div>
                <div class="ln dim" data-k="tty:     pts/3"></div>
              </div>
            </article>
          </div>
        </section>
      </main>

      <footer class="foot" data-reveal>
        empty-console v0.0.1 by empty console
      </footer>
    </div>

    <script src="js/boot.js"></script>
    <script src="js/site.js"></script>
  </body>
</html>
